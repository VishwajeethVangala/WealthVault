<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Shield Crest Geometry (Centered & Proportioned for Favicon legibility) -->
  <g transform="translate(32, 32) scale(1.65) translate(-12, -12)">
    <!-- Shield Fill with subtle emerald tint -->
    <path
      d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
      fill="url(#innerGlow)"
    />
    <!-- Shield Outline in Vibrant Emerald Gradient -->
    <path
      d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
      fill="none"
      stroke="url(#shieldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Inner Vault Core Accent -->
    <path
      d="M12 8v4"
      stroke="#34d399"
      stroke-width="2"
      stroke-linecap="round"
    />
    <circle
      cx="12"
      cy="14.5"
      r="1.2"
      fill="#34d399"
    />
  </g>
</svg>