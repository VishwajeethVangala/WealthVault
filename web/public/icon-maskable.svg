<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- shield kept inside the central 80% so Android can crop the icon to any shape -->
  <g transform="translate(256, 256) scale(11.2) translate(-12, -12)">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#10b981" fill-opacity="0.16" stroke="url(#shield)" stroke-width="1.6" stroke-linejoin="round" fill-opacity="0.16" />
    <!-- Rising trend line inside the shield -->
    <path d="M8 15l3-3.2 2.2 2L16.5 10" stroke="#34d399" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M14.2 10h2.3v2.3" stroke="#34d399" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
