name: Deploy to Azure App Service

on:
  # Manual until the Azure app and secrets exist (see DEPLOY.md). Add `push: {branches: [main]}` to deploy on every push.
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Backend tests
        run: |
          pip install -r requirements.txt pytest
          AZURE_STORAGE_CONNECTION_STRING="UseDevelopmentStorage=true" python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend into dist/
        run: |
          cd web
          npm ci
          npm run build
        # vite.config.ts writes to ../dist

      - name: Check the build output
        run: test -f dist/index.html

      - name: Package
        run: |
          zip -rq release.zip . -x ".git/*" "android/*" "web/node_modules/*" "tests/*" ".github/*" "*/__pycache__/*" "storage/blobs/*token*" "storage/blobs/*session*" "storage/blobs/indmoney_client.json"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
